name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Never run this on the private repo: its Actions minutes are exhausted.
    if: github.repository == 'DrNoisys-Softworks/gm-scriptorium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run verify-generator
      # Deliberately not `npm run package` here: it downloads the Node
      # binaries for both packaging targets, which is too slow and heavy to
      # run on every push. Packaging is verified at release time instead.

  hygiene:
    # Same guard as the test job: never run this on the private repo.
    if: github.repository == 'DrNoisys-Softworks/gm-scriptorium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/public-guard.js ci
