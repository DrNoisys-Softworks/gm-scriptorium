name: Feature request
description: Suggest an improvement to the CLI, admin panel or build pipeline.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste campaign content, real player or character names, or
        vault paths. Use made-up examples.**
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
