<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" seed="7" result="n"/>
<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.39  0 0 0 0 0.24  0 0 0 .09 0"/>
</filter>
<filter id="mottle" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" stitchTiles="stitch" seed="3" result="m"/>
<feColorMatrix in="m" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 .10 0"/>
</filter>
</defs>
<rect width="400" height="400" filter="url(#mottle)"/>
<rect width="400" height="400" filter="url(#grain)"/>
</svg>
